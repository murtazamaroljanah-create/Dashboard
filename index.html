<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance – Per Person Lookup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a1a2e; }

  .header {
    background: linear-gradient(135deg, #1F3864 0%, #2E75B6 100%);
    color: white;
    padding: 20px 30px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 1.5rem; }
  .header .sub { font-size: 0.85rem; opacity: 0.8; margin-top: 3px; }

  .search-section {
    background: white;
    padding: 20px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .search-section label { font-weight: bold; font-size: 0.9rem; color: #1F3864; }
  #searchInput {
    border: 2px solid #2E75B6;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 1rem;
    width: 240px;
    outline: none;
    transition: box-shadow 0.2s;
  }
  #searchInput:focus { box-shadow: 0 0 0 3px rgba(46,117,182,0.2); }
  #searchBtn {
    background: #2E75B6;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  #searchBtn:hover { background: #1F3864; }
  #clearBtn {
    background: #eee;
    color: #555;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #hint { font-size: 0.82rem; color: #888; }

  .suggestions {
    position: relative;
  }
  #dropdown {
    position: absolute;
    top: 46px; left: 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    max-height: 260px;
    overflow-y: auto;
    z-index: 100;
    min-width: 320px;
    display: none;
  }
  .dd-item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    border-bottom: 1px solid #f0f0f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .dd-item:hover { background: #e8f0fe; }
  .dd-trno { font-weight: bold; color: #2E75B6; font-size: 0.85rem; }
  .dd-name { color: #333; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .content { padding: 24px 30px; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 1rem; }

  /* Person card */
  .person-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .person-header {
    background: linear-gradient(135deg, #1F3864 0%, #2E75B6 100%);
    color: white;
    padding: 22px 28px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .person-header .name { font-size: 1.25rem; font-weight: bold; }
  .person-header .trno-badge {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.85rem;
    font-weight: bold;
  }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0;
    border-bottom: 1px solid #eee;
  }
  .kpi-box {
    padding: 18px 20px;
    border-right: 1px solid #eee;
    text-align: center;
  }
  .kpi-box:last-child { border-right: none; }
  .kpi-val { font-size: 1.8rem; font-weight: bold; color: #2E75B6; }
  .kpi-label { font-size: 0.78rem; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  .section { padding: 22px 24px; border-right: 1px solid #eee; }
  .section:last-child { border-right: none; }
  .section-title {
    font-size: 0.85rem;
    font-weight: bold;
    color: #1F3864;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
  }

  /* Monthly bars */
  .month-bars { display: flex; flex-direction: column; gap: 7px; }
  .month-row { display: flex; align-items: center; gap: 8px; }
  .month-label { width: 72px; font-size: 0.8rem; color: #555; flex-shrink: 0; }
  .bar-track { flex: 1; background: #eef2f7; border-radius: 4px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2E75B6, #5ba3d9); transition: width 0.6s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 5px; min-width: 0; }
  .bar-count { font-size: 0.72rem; color: white; font-weight: bold; white-space: nowrap; }
  .bar-zero .bar-fill { background: #ddd; }

  /* Purpose table */
  .purpose-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .purpose-table td { padding: 7px 6px; border-bottom: 1px solid #f0f0f0; }
  .purpose-table td:last-child { text-align: right; font-weight: bold; color: #2E75B6; }
  .purpose-table tr:last-child td { border-bottom: none; }

  /* Bottom strip */
  .stats-strip {
    background: #f7f9fc;
    border-top: 1px solid #eee;
    padding: 14px 24px;
    display: flex; gap: 24px; flex-wrap: wrap;
    font-size: 0.82rem; color: #666;
  }
  .stats-strip span b { color: #1F3864; }

  /* Results list */
  .results-list { display: flex; flex-direction: column; gap: 10px; }
  .result-item {
    background: white;
    border-radius: 8px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 16px; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: box-shadow 0.15s, background 0.15s;
    border-left: 4px solid #2E75B6;
  }
  .result-item:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.12); background: #f0f6ff; }
  .ri-trno { font-weight: bold; color: #2E75B6; font-size: 1rem; min-width: 60px; }
  .ri-name { flex: 1; font-size: 0.92rem; }
  .ri-visits { background: #2E75B6; color: white; border-radius: 12px; padding: 3px 10px; font-size: 0.8rem; font-weight: bold; }
  .ri-avg { color: #888; font-size: 0.82rem; min-width: 90px; text-align: right; }

  .results-header { font-size: 0.85rem; color: #666; margin-bottom: 10px; }
</style>
</head>

<div class="header">
  <div>

</div>

;

const months = DATA.months;
const persons = DATA.persons;

// Index by trno and name
const byTrno = {};
persons.forEach(p => { byTrno[p.trno] = p; });

const input = document.getElementById('searchInput');
const dropdown = document.getElementById('dropdown');
const content = document.getElementById('content');

function getMatches(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  return persons.filter(p =>
    p.trno.toLowerCase().includes(q) ||
    p.name.toLowerCase().includes(q)
  ).slice(0, 20);
}

input.addEventListener('input', () => {
  const q = input.value.trim();
  if (!q) { dropdown.style.display = 'none'; return; }
  const matches = getMatches(q);
  if (!matches.length) { dropdown.style.display = 'none'; return; }
  dropdown.innerHTML = matches.map(p =>
    `<div class="dd-item" data-trno="${p.trno}">
      <span class="dd-name">${p.name}</span>
      <span class="dd-trno">${p.trno}</span>
    </div>`
  ).join('');
  dropdown.style.display = 'block';
  dropdown.querySelectorAll('.dd-item').forEach(el => {
    el.addEventListener('click', () => {
      input.value = el.dataset.trno;
      dropdown.style.display = 'none';
      showPerson(el.dataset.trno);
    });
  });
});

document.addEventListener('click', e => {
  if (!dropdown.contains(e.target) && e.target !== input) dropdown.style.display = 'none';
});

document.getElementById('searchBtn').addEventListener('click', doSearch);
input.addEventListener('keydown', e => { if (e.key === 'Enter') { dropdown.style.display='none'; doSearch(); }});
document.getElementById('clearBtn').addEventListener('click', () => {
  input.value = '';
  dropdown.style.display = 'none';
  content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Search for a student by their TR.NO or name to see their attendance details.</p></div>`;
});

function doSearch() {
  const q = input.value.trim();
  if (!q) return;
  // Exact trno match first
  if (byTrno[q]) { showPerson(q); return; }
  // Otherwise show results list
  const matches = getMatches(q);
  if (!matches.length) {
    content.innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>No student found for "<b>${q}</b>"</p></div>`;
    return;
  }
  if (matches.length === 1) { showPerson(matches[0].trno); return; }
  showList(matches, q);
}

function showList(matches, q) {
  content.innerHTML = `
    <div class="results-header">Found <b>${matches.length}</b> results for "<b>${q}</b>"</div>
    <div class="results-list">
      ${matches.map(p => `
        <div class="result-item" data-trno="${p.trno}">
          <span class="ri-trno">${p.trno}</span>
          <span class="ri-name">${p.name}</span>
          <span class="ri-avg">${p.avg_hours}h avg</span>
          <span class="ri-visits">${p.total_visits} visits</span>
        </div>
      `).join('')}
    </div>`;
  content.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => showPerson(el.dataset.trno));
  });
}

function showPerson(trno) {
  const p = byTrno[trno];
  if (!p) return;
  const maxM = Math.max(...Object.values(p.monthly), 1);
  const monthRows = months.map(m => {
    const c = p.monthly[m] || 0;
    const pct = Math.round(c / maxM * 100);
    return `<div class="month-row ${c===0?'bar-zero':''}">
      <span class="month-label">${m.replace(' 2025','')}</span>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%">
          ${c>0 ? `<span class="bar-count">${c}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const purposeRows = Object.entries(p.purposes)
    .sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
    .join('');

  const bestMonth = months.reduce((best, m) => (p.monthly[m]||0) > (p.monthly[best]||0) ? m : best, months[0]);
  const activeMonths = months.filter(m => (p.monthly[m]||0) > 0).length;

  content.innerHTML = `
    <div class="person-card">
      <div class="person-header">
        <div>
          <div class="name">${p.name}</div>
        </div>
        <div class="trno-badge">TR.NO: ${p.trno}</div>
      </div>

      <div class="kpi-row">
        <div class="kpi-box">
          <div class="kpi-val">${p.total_visits}</div>
          <div class="kpi-label">Total Visits</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val">${p.avg_hours}h</div>
          <div class="kpi-label">Avg Duration</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val">${p.avg_min} min</div>
          <div class="kpi-label">Avg in Minutes</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val">${activeMonths}</div>
          <div class="kpi-label">Active Months</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val">${bestMonth.replace(' 2025','')}</div>
          <div class="kpi-label">Busiest Month</div>
        </div>
      </div>

      <div class="two-col">
        <div class="section">
          <div class="section-title">📅 Monthly Visits</div>
          <div class="month-bars">${monthRows}</div>
        </div>
        <div class="section">
          <div class="section-title">🎯 Visit Purpose</div>
          <table class="purpose-table">
            <tbody>${purposeRows}</tbody>
          </table>
        </div>
      </div>

      <div class="stats-strip">
        <span>Period: <b>Apr – Dec 2025</b></span>
        <span>Most active: <b>${bestMonth}</b> (${p.monthly[bestMonth]} visits)</span>
        <span>Avg/month: <b>${(p.total_visits / activeMonths).toFixed(1)}</b> visits</span>
      </div>
    </div>`;
}
</script>
